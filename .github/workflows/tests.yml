name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: ${{ matrix.python }}
      - name: Unit, integration and fault tests
        working-directory: tests
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          set -o pipefail
          python -m unittest discover -s . -p "test_*.py" -v 2>&1 | tee ../test-output.txt
      - name: Report failures as annotations
        if: failure()
        shell: bash
        run: python tests/ci_annotate.py test-output.txt

  container-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Prepare test image and record its immutable ID
        shell: bash
        run: |
          docker pull python:3.13-slim
          image_id=$(docker image inspect python:3.13-slim --format '{{.Id}}')
          echo "IMPERIUM_TEST_IMAGE=$image_id" >> "$GITHUB_ENV"
          echo "Verification test image: $image_id"
      - name: Exercise the actual container boundary
        env:
          PYTHONPATH: src:tests
        run: python -m unittest test_container_verification -v
