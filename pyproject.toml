[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "imperium-ai"
version = "0.1.0.dev0"
description = "Exactly-once prompt delivery, an acknowledged event journal and verified rounds between an AI director and AI coding builders."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
liveness = ["psutil>=5.9"]

[project.scripts]
imperium = "imperium.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
